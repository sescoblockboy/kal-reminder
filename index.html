<style>
  :root{
    --bg:#FAF7F4;--card:#fff;--ink:#1B1B22;--muted:#6B6672;--line:#E9E2DC;
    --gold:#B8892D;--gold2:#EBD28F;--blue:#2F86D6;--green:#1FA463;
    --y:#E5A800;--o:#F08A00;--r:#E5362B;
    --shadow:0 2px 14px rgba(60,40,50,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100dvh;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#FFF1EF 0,var(--bg) 320px) var(--bg);background-attachment:scroll}
  body.critical{background:linear-gradient(180deg,#FFE2DE 0,var(--bg) 320px) var(--bg)}
  button{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom))}

  /* header */
  .head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:6px;background:rgba(250,247,244,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .head img{width:38px;height:38px;border-radius:10px}
  .head h1{margin:0;font-size:20px;letter-spacing:-.01em;flex:1}
  .head h1 span{color:var(--gold)}
  .sim{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:#FFF3C9;border:1px solid #F0D777;border-radius:14px;padding:8px 12px;margin-bottom:12px;font-size:14px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:15px;cursor:pointer;transition:transform .12s,filter .12s}
  .btn:hover{filter:brightness(.98)}.btn:active{transform:scale(.97)}
  .btn.sm{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:11px}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.gold{background:linear-gradient(180deg,#F6E4AA,#D2A949);border-color:#D2A949;color:#2c2108}
  .btn.danger{background:var(--r);border-color:var(--r);color:#fff}
  .btn.warn{color:#B3261E}
  .btn.icon{width:44px;padding:0}
  .fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:6;width:60px;height:60px;border-radius:50%;padding:0;font-size:32px;line-height:1;box-shadow:0 8px 22px rgba(120,90,30,.4)}
  .hide-m{display:none}

  /* layout */
  .cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
  .col{display:grid;gap:14px;align-content:start;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
  .card h2{margin:0;font-size:17px}
  .card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .muted,.sub{color:var(--muted);font-size:14px}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:15px}

  /* hero */
  .hero{padding:20px}
  .hero .big{font-size:clamp(30px,7vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px;color:var(--blue)}
  .hero .who{font-size:16px;font-weight:650}
  .hero .amt{font-size:24px;font-weight:800;margin:6px 0 2px}
  .hero .od{color:var(--r);font-weight:700;margin-top:6px}
  .hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .hero.ok .big{color:var(--green)}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--blue);display:inline-block;flex:none}
  .hero.t-y{--c:var(--y);--g:rgba(229,168,0,.5);--spd:2.6s;background:#FFF9DF;border-color:#F1D467}.hero.t-y .big{color:#9A7400}
  .hero.t-o{--c:var(--o);--g:rgba(240,138,0,.45);--spd:1.5s;background:#FFF0DC;border-color:#F4BC73}.hero.t-o .big{color:#C96A00}
  .hero.t-r{--c:var(--r);--g:rgba(229,54,43,.5);--spd:.8s;background:#FFE6E3;border-color:#F2A19A}.hero.t-r .big{color:var(--r)}
  .hero.t-d{background:#FFDAD6;border-color:var(--r)}.hero.t-d .big{color:var(--r)}
  .hero.t-y,.hero.t-o,.hero.t-r{animation:pulse var(--spd) ease-in-out infinite}
  .hero.t-y .dot,.hero.t-o .dot,.hero.t-r .dot{background:var(--c)}.hero.t-d .dot{background:var(--r);box-shadow:0 0 10px 3px rgba(229,54,43,.5)}
  .hero.ok .dot{background:var(--green)}
  @keyframes pulse{0%,100%{box-shadow:var(--shadow)}12%{box-shadow:0 0 0 5px var(--g),var(--shadow)}34%{box-shadow:var(--shadow)}}

  /* totals */
  .tot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tot .v{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:2px;word-break:break-word}
  .bar{height:10px;border-radius:99px;background:#EFE8E2;overflow:hidden;margin:10px 0 4px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--gold))}

  /* loans */
  .loans{display:grid;gap:10px}
  .loan{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
  .loan .nm{font-size:17px;font-weight:750;word-break:break-word}
  .loan .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .loan .kv b{display:block;font-size:16px}
  .loan .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  /* chips + rows */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;margin-bottom:2px;-webkit-overflow-scrolling:touch}
  .chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:14px;cursor:pointer}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .rows{display:grid;gap:8px}
  .row{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fff;border-left:5px solid var(--line)}
  .row>*{position:relative;z-index:1}
  .row .tx{grid-column:1;min-width:0}
  .row .tx b{display:block;font-size:15px;overflow-wrap:anywhere}
  .row .tx span{display:block;color:var(--muted);font-size:13.5px}
  .row .tag{grid-column:2}
  .row .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
  .tag{padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:750;white-space:nowrap;background:#E7F1FB;color:var(--blue)}
  .tag.ok{background:#E2F5EA;color:var(--green)}
  .tag.t-y{background:#FFF0B8;color:#8A6A00}.tag.t-o{background:#FFE2BC;color:#B85F00}.tag.t-r{background:#FFD9D5;color:var(--r)}.tag.t-d{background:var(--r);color:#fff}
  .row.t-y{--c:var(--y);--spd:2.6s;border-left-color:var(--y)}
  .row.t-o{--c:var(--o);--spd:1.5s;border-left-color:var(--o)}
  .row.t-r{--c:var(--r);--spd:.8s;border-left-color:var(--r)}
  .row.t-d{border-left-color:var(--r);background:#FFE6E3}
  .row.paid{opacity:.7;border-left-color:var(--green)}
  .row.t-y::after,.row.t-o::after,.row.t-r::after{content:"";position:absolute;inset:0;background:var(--c);opacity:.03;animation:rowBeep var(--spd) ease-in-out infinite;pointer-events:none;z-index:0}
  @keyframes rowBeep{0%,100%{opacity:.03}12%{opacity:.30}34%{opacity:.04}}
  .more{display:flex;justify-content:center;margin-top:10px}

  /* modal */
  .ov{position:fixed;inset:0;z-index:20;background:rgba(30,20,30,.4);display:none;align-items:flex-end;justify-content:center}
  .ov.on{display:flex}
  .modal{width:100%;max-width:540px;max-height:92dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out;box-shadow:0 -10px 50px rgba(30,20,30,.25)}
  @keyframes up{from{transform:translateY(30px);opacity:0}}
  .modal h2{margin:0 0 4px;font-size:21px}
  .modal h3{margin:18px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  label{display:block;font-size:14px;font-weight:650;margin:12px 0 5px}
  label small{font-weight:500;color:var(--muted)}
  input[type=text],input[type=number],input[type=date],input[type=password],input[type=email],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);min-height:46px;padding:10px 12px;border-radius:13px;outline:0;background:#fff;border:1.5px solid #DDD5CF;appearance:none;-webkit-appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
  textarea{min-height:70px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,137,45,.18)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}

<script>
/* ============ settings you may change ============ */

document.getElementById('lg').src=LOGO;

/* ============ storage (one slot per email) ============ */
var BASE='loanAlerts.v1',SESSION='loanAlerts.session',KEY=BASE;
function userKey(e){return BASE+'.u.'+String(e).trim().toLowerCase()}
function getSession(){try{return localStorage.getItem(SESSION)||''}catch(e){return ''}}
var DEF={contact:{email:'',tgUser:'',tgToken:'',tgChat:'',ejService:'',ejTemplate:'',ejKey:''},
  alerts:{leads:'7,3,1,0',browser:true,sound:true,ntfy:'',y:7,o:3,r:1}};
function blank(){return{cal:'g',loans:[],contact:Object.assign({},DEF.contact),alerts:Object.assign({},DEF.alerts),reminders:[],paid:{},sent:{},removed:{},mailLast:null,sim:'',init:false,showPaid:false,account:''}}
var S=blank();
function load(){var s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  var loans=s.loans||(s.loan?[Object.assign({id:'l1'},s.loan)]:[]),paid=s.paid||{};
  Object.keys(paid).forEach(function(k){var m=/^L(\d+)$/.exec(k);if(m){paid['l1-'+m[1]]=paid[k];delete paid[k]}});
  return{cal:s.cal==='e'?'e':'g',loans:loans,contact:Object.assign({},DEF.contact,s.contact),alerts:Object.assign({},DEF.alerts,s.alerts),reminders:s.reminders||[],paid:paid,sent:s.sent||{},removed:s.removed||{},mailLast:s.mailLast||null,sim:'',init:!!s.init,showPaid:!!s.showPaid,account:s.account||''}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ helpers ============ */
var $=function(id){return document.getElementById(id)};
/* Ethiopian (Amharic) calendar */
var AMM=['መስከረም','ጥቅምት','ኅዳር','ታኅሣሥ','ጥር','የካቲት','መጋቢት','ሚያዝያ','ግንቦት','ሰኔ','ሐምሌ','ነሐሴ','ጳጉሜን'],
    AMW=['እሑድ','ሰኞ','ማክሰኞ','ረቡዕ','ሐሙስ','ዓርብ','ቅዳሜ'];
function gregToJdn(y,m,d){var a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function jdnToGreg(j){var a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4),d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);
  return{d:e-Math.floor((153*m+2)/5)+1,m:m+3-12*Math.floor(m/10),y:100*b+d-4800+Math.floor(m/10)}}
function ethToJdn(y,m,d){return 1724220+365*(y-1)+Math.floor(y/4)+30*(m-1)+d}
function toEth(gy,gm,gd){var j=gregToJdn(gy,gm,gd),y=Math.floor((j-1724221)/365.25)+1;while(ethToJdn(y+1,1,1)<=j)y++;while(ethToJdn(y,1,1)>j)y--;var r=j-ethToJdn(y,1,1);return{y:y,m:Math.floor(r/30)+1,d:r%30+1}}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n,cur){var s=(Math.round((+n||0)*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');return (cur?cur+' ':'')+s}
function fm(n){return Math.abs(Math.round(+n||0)).toLocaleString('en-US')}
function pn(v){return +String(v==null?'':v).replace(/,/g,'')||0}
function fmtIn(v){return(v===''||v==null||isNaN(+v))?'':Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}
function numFmt(el){var raw=el.value,pos=el.selectionStart,before=raw.slice(0,pos).replace(/,/g,'').length;
  var clean=raw.replace(/[^0-9.]/g,''),parts=clean.split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  el.value=parts.length>1?parts[0]+'.'+parts.slice(1).join(''):parts[0];
  var c=0,np=0;for(;np<el.value.length&&c<before;np++){if(el.value[np]!==',')c++}try{el.setSelectionRange(np,np)}catch(e){}}
function thr(){var a=S.alerts,R=Math.max(1,parseInt(a.r,10)||1),O=Math.max(R,parseInt(a.o,10)||3),Y=Math.max(O,parseInt(a.y,10)||7);return{Y:Y,O:O,R:R}}
function tierOf(d){var t=thr();return d<=0?'d':d<=t.R?'r':d<=t.O?'o':d<=t.Y?'y':''}
function pad(n){return n<10?'0'+n:''+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return S.sim||isoOf(new Date())}
function dn(iso){var p=iso.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)}
function nice(iso){var p=iso.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);
  if(S.cal==='e'){var e=toEth(p[0],p[1],p[2]);return AMW[d.getDay()]+' '+e.d+' '+AMM[e.m-1]+' '+e.y+' ዓ.ም'}
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function dateField(id,iso){
  if(S.cal!=='e')return '<input type="date" id="'+id+'" value="'+esc(iso||'')+'" onchange="preview()">';
  var e=null;if(iso){var p=iso.split('-').map(Number);e=toEth(p[0],p[1],p[2])}
  var t=today().split('-').map(Number),y0=toEth(t[0],t[1],t[2]).y,o1='<option value="">ቀን</option>',o2='<option value="">ወር</option>',o3='<option value="">ዓ.ም</option>',i;
  for(i=1;i<=30;i++)o1+='<option value="'+i+'"'+(e&&e.d===i?' selected':'')+'>'+i+'</option>';
  for(i=1;i<=13;i++)o2+='<option value="'+i+'"'+(e&&e.m===i?' selected':'')+'>'+AMM[i-1]+'</option>';
  for(i=y0-25;i<=y0+15;i++)o3+='<option value="'+i+'"'+(e&&e.y===i?' selected':'')+'>'+i+'</option>';
  return '<div class="three"><select id="'+id+'_d" onchange="preview()">'+o1+'</select><select id="'+id+'_m" onchange="preview()">'+o2+'</select><select id="'+id+'_y" onchange="preview()">'+o3+'</select></div>'}
function dateVal(id){
  if(S.cal!=='e')return($(id)||{}).value||'';
  var d=+($(id+'_d')||{}).value,m=+($(id+'_m')||{}).value,y=+($(id+'_y')||{}).value;if(!d||!m||!y)return '';
  if(m===13)d=Math.min(d,y%4===3?6:5);
  var g=jdnToGreg(ethToJdn(y,m,d));return g.y+'-'+pad(g.m)+'-'+pad(g.d)}
function twoCls(){return S.cal==='e'?' style="grid-template-columns:1fr"':''}
function toast(m,undo){var t=$('toast');t.innerHTML=esc(m)+(undo?' <button onclick="undoDel()">Undo</button>':'');t.className='toast show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className='toast'},undo?7000:5200)}
function leads(){var a=String(S.alerts.leads).split(/[,\s;]+/).map(function(x){return parseInt(x,10)}).filter(function(n){return !isNaN(n)&&n>=0&&n<=365});
  a=a.filter(function(v,i){return a.indexOf(v)===i}).sort(function(x,y){return x-y});return a.length?a:[0]}

/* ============ loan maths ============ */
function addMonths(y,m,d,add){var t=new Date(y,m+add,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return new Date(t.getFullYear(),t.getMonth(),Math.min(d,last))}
function lname(L){var b=L.bank||'',n=L.name||'';return b?(n&&n!==b?b+' · '+n:b):(n||'Loan')}
function stepOf(L){if(+L.every>0)return Math.max(1,Math.round(+L.every))*(L.everyUnit==='years'?12:1);return 12/(+L.perYear||12)}
function termMonths(L){if(L.termVal!=null&&L.termVal!=='')return(+L.termVal||0)*(L.termUnit==='months'?1:12);return(+L.years||0)*12}
function freqText(L){var st=stepOf(L);if(st%12===0){var y=st/12;return y===1?'Every year':'Every '+y+' years'}return st===1?'Every month':'Every '+st+' months'}
function schedule(L){
  var step=stepOf(L),n=Math.ceil(termMonths(L)/step-1e-9);if(!(+L.amount>0)||!(n>0)||!L.start||!(step>0))return[];
  var r=(+L.rate||0)/100*step/12,g=Math.min(Math.max(0,parseInt(L.grace,10)||0),n-1),m=n-g,fee=+L.fee||0,method=L.method||'annuity';
  var pmt=r?L.amount*r/(1-Math.pow(1+r,-m)):L.amount/m,eqp=L.amount/m,bal=+L.amount,out=[];
  var st=L.start.split('-').map(Number),fp=L.first?L.first.split('-').map(Number):null;
  for(var k=1;k<=n;k++){
    var d=fp?addMonths(fp[0],fp[1]-1,fp[2],(k-1)*step):addMonths(st[0],st[1]-1,st[2],k*step);
    var it=bal*r,pr,pay;
    if(k<=g){pr=0;pay=it}
    else if(k===n){pr=bal;pay=bal+it}
    else if(method==='declining'){pr=eqp;pay=pr+it}
    else{pay=pmt;pr=pay-it}
    out.push({id:L.id+'-'+k,kind:'loan',loan:L.id,no:k,n:n,title:lname(L),bank:L.bank||L.name||'Loan',cur:L.currency||'',date:isoOf(d),amount:pay+fee,principal:pr,interest:it,fee:fee,beg:bal,end:Math.max(0,bal-pr)});
    bal-=pr}
  return out}
function items(){
  var t=dn(today()),all=[];
  S.loans.forEach(function(L){all=all.concat(schedule(L).filter(function(i){return !S.removed[i.id]}))});
  S.reminders.forEach(function(r){all.push({id:r.id,kind:'rem',title:r.title,bank:'',cur:r.cur||'',date:r.date,amount:+r.amount||0})});
  all.forEach(function(i){i.days=dn(i.date)-t;i.paid=!!S.paid[i.id]});
  all.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});return all}

/* ============ alerts: sound, desktop, phone, email, telegram ============ */
var audio=null,beepTimer=null,snooze=0,cur=null;
function ensureAudio(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.resume)audio.resume();return true}catch(e){return false}}
var TIERS={y:{ms:3000,f:[660],v:.12},o:{ms:1800,f:[780,880],v:.18},r:{ms:900,f:[880,1040,880],v:.24}},beepKey='';
function playTier(t){if(!audio||!TIERS[t])return;var T=TIERS[t];T.f.forEach(function(fr,i){var os=audio.createOscillator(),g=audio.createGain(),at=audio.currentTime+i*.16;os.type='sine';os.frequency.value=fr;
  g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(T.v,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+.13);os.connect(g);g.connect(audio.destination);os.start(at);os.stop(at+.15)})}
function beep(){playTier('r')}
function syncBeep(){var t=cur&&cur.tier,on=!!(t&&t!=='d'&&S.alerts.sound&&audio&&S.account),key=on?t:'';
  if(key!==beepKey){clearInterval(beepTimer);beepTimer=null;beepKey=key;
    if(on){playTier(t);beepTimer=setInterval(function(){if(Date.now()>snooze)playTier(t)},TIERS[t].ms)}}}
document.addEventListener('click',function(){if(S.account&&S.alerts.sound&&!audio){ensureAudio();syncBeep()}});

function emailVia(){var C=S.contact;return(C.ejService&&C.ejTemplate&&C.ejKey)?'emailjs':'formsubmit'}
function emailOK(){return emailVia()==='emailjs'||location.protocol!=='file:'}
function mailStatusHtml(){var m=S.mailLast;
  if(!S.contact.email)return 'Type your Gmail address above, then press Send test email.';
  if(!emailOK())return '<b>Blocked:</b> this page was opened as a file and the default email service (FormSubmit) refuses that. Fill in the EmailJS box below (works from a file), or open the page with start-loan-alerts.bat.';
  if(!m)return 'Nothing sent yet. Press Send test email to check it.';
  return(m.ok?'<b>Last result:</b> ':'<b>Failed:</b> ')+esc(m.msg)+' <span style="opacity:.6">('+esc(m.t)+')</span>'}
function setMail(ok,msg){S.mailLast={ok:ok,msg:msg,t:new Date().toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};save();
  var b=$('mailStatus');if(b)b.innerHTML=mailStatusHtml();toast((ok?'Email: ':'Email problem: ')+msg)}
function postEmail(title,body){
  var C=S.contact,to=C.email.trim();
  if(emailVia()==='emailjs'){
    return fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({service_id:C.ejService.trim(),template_id:C.ejTemplate.trim(),user_id:C.ejKey.trim(),template_params:{to_email:to,subject:title,message:body}})})
     .then(function(r){return r.text().then(function(t){return{ok:r.ok,t:t}})})
     .then(function(x){x.ok?setMail(true,'sent to '+to+' from your Gmail (EmailJS)'):setMail(false,'EmailJS replied: '+x.t)})
     .catch(function(){setMail(false,'could not reach EmailJS (offline?)')})}
  return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({_subject:title,name:'Loan Alerts',message:body,_template:'box',_captcha:'false'})})
   .then(function(r){return r.json()})

    +'<h3>Email</h3><label>Your Gmail</label><input type="email" id="m_email" value="'+esc(C.email)+'" placeholder="you@gmail.com">'
    +'<div class="mailbox" id="mailStatus">'+mailStatusHtml()+'</div><div class="mbtns"><button class="btn sm" onclick="sendTestEmail()">Send test email</button></div>'
    +'<details'+((C.ejService||C.ejTemplate||C.ejKey||(S.mailLast&&!S.mailLast.ok))?' open':'')+'><summary>Email setup with EmailJS (sends from your Gmail)</summary>'
      +'<div class="hint">Without this, email goes through FormSubmit, which only works from a web address and needs one confirmation click. <b>1)</b> Sign up free at emailjs.com. <b>2)</b> Email Services, Add service, Gmail, connect your account, copy the <b>Service ID</b>. <b>3)</b> Email Templates, Create: set <b>To email</b> to {{to_email}}, <b>Subject</b> to {{subject}}, and the content to {{message}}. Save and copy the <b>Template ID</b>. <b>4)</b> Account, General: copy the <b>Public Key</b>. <b>5)</b> Paste the three values here, then press Send test email.</div>'
      +'<label>Service ID</label><input type="text" id="m_ejs" value="'+esc(C.ejService)+'" placeholder="service_xxxxxxx">'
      +'<label>Template ID</label><input type="text" id="m_ejt" value="'+esc(C.ejTemplate)+'" placeholder="template_xxxxxxx">'

function closeModal(){tgStop();$('ov').className='ov'}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function permText(){if(!('Notification' in window))return 'This browser has no desktop notifications.';return Notification.permission==='granted'?'Pop-ups are allowed':Notification.permission==='denied'?'Blocked. Click the lock icon in the address bar to allow them':'Not allowed yet - press the button.'}
function askPerm(){if(!('Notification' in window))return toast('Not supported here');Notification.requestPermission().then(function(){if($('m_perm'))$('m_perm').textContent=permText();toast(permText())})}

function saveLoan(){
  var L=readLoan();
  if(!L.bank)return toast('Type the bank or lender name');
  if(!(L.amount>0))return toast('Type the loan amount');
  if(!(L.years>0))return toast('Type the loan length');
  if(!L.start)return toast('Pick the start date');
  if(editing)S.loans=S.loans.map(function(x){return x.id===editing?L:x});else S.loans.push(L);
  if($('f_past').checked){var t=dn(today());schedule(L).forEach(function(i){if(dn(i.date)<t)S.paid[i.id]=today()})}
  var was=editing;save();closeModal();filter='all';render();toast(was?'Loan updated':'Loan added');if(!was)tgLoanSummary(L)}
function delLoan(id){var L=S.loans.filter(function(l){return l.id===id})[0];if(!confirm('Delete '+(L?lname(L):'this loan')+' and all its payments?'))return;
  S.loans=S.loans.filter(function(l){return l.id!==id});
  Object.keys(S.paid).forEach(function(k){if(k.indexOf(id+'-')===0)delete S.paid[k]});Object.keys(S.removed).forEach(function(k){if(k.indexOf(id+'-')===0)delete S.removed[k]});save();render();toast('Loan deleted')}
function saveAlerts(){var A=S.alerts;A.leads=$('m_leads').value;A.sound=$('m_sound').checked;A.browser=$('m_br').checked;A.ntfy=$('m_ntfy').value.trim();A.y=+$('m_y').value||7;A.o=+$('m_o').value||3;A.r=+$('m_r').value||1;if(A.sound)ensureAudio();save();render()}
function saveContact(){
  var C=S.contact;readMail();if($('m_tok'))C.tgToken=$('m_tok').value.trim();
  save();closeModal();render();toast('Saved')}
function markPast(loanId){var t=dn(today());items().forEach(function(i){if(i.kind==='loan'&&(!loanId||i.loan===loanId)&&dn(i.date)<t)S.paid[i.id]=today()});save();render();openModal('payments',loanId);toast('Past payments marked paid')}
function resetPaid(loanId){if(!confirm('Clear every paid mark for this loan?'))return;Object.keys(S.paid).forEach(function(k){if(k.indexOf(loanId+'-')===0)delete S.paid[k]});save();render();openModal('payments',loanId)}
function addRem(){var t=$('m_rt').value.trim(),d=dateVal('m_rd');if(!t||!d)return toast('Add a name and a date');S.reminders.push({id:'R'+Date.now(),title:t,date:d,amount:pn($('m_ra').value)});save();closeModal();render();toast('Reminder added')}
function testNotify(){var s=notify('Loan Alert TEST','This is a test alert from your Loan Alerts page.',true);toast(s.length?'Test sent via '+s.join(' + '):'Nothing enabled yet - allow pop-ups or add a contact');if(S.alerts.sound){ensureAudio();beep()}}
function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='loan-alerts-backup.json';a.click()}
function importData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);o.account=S.account;localStorage.setItem(KEY,JSON.stringify(o));S=load();S.account=o.account;closeModal();render();toast('Imported')}catch(e){toast('Not a valid backup file')}};r.readAsText(f)}

/* ============ delete / restore ============ */
var lastDel=null;
function delItem(id){
  var rem=S.reminders.filter(function(r){return r.id===id})[0]||null;
  lastDel={id:id,rem:rem,paid:S.paid[id]||null};
  if(rem){S.reminders=S.reminders.filter(function(r){return r.id!==id})}else{S.removed[id]=1}
  delete S.paid[id];save();render();toast('Deleted',true)}
function undoDel(){if(!lastDel)return;var d=lastDel;lastDel=null;
  if(d.rem)S.reminders.push(d.rem);else delete S.removed[d.id];
  if(d.paid)S.paid[d.id]=d.paid;save();render();toast('Restored')}
function restoreAll(){S.removed={};save();render();toast('Deleted payments restored');if(modalKind==='payments')openModal('payments',modalArg)}

/* ============ test dates ============ */
function addDays(iso,n){var p=iso.split('-').map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+n))}
function setSim(iso){S.sim=iso||'';S.sentSim={};save();render()}
function stepSim(n){setSim(addDays(today(),n));openModal('test')}
function jumpSim(n){var real=isoOf(new Date()),un=items().filter(function(i){return !i.paid});
  var base=un.filter(function(i){return i.date>=real})[0]||un[0];if(!base)return toast('Add a loan or a reminder first');setSim(addDays(base.date,-n));openModal('test')}

/* ============ sign-in (separate data per email, password protected) ============ */
var timers=[];
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)}
function authKey(e){return BASE+'.auth.'+e}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return('0'+x.toString(16)).slice(-2)}).join('')}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
async function hashPw(pw,saltHex){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(saltHex),iterations:150000,hash:'SHA-256'},k,256))}
function note(t){$('li_note').textContent=t}
async function doLogin(){
  var e=$('li_email').value.trim().toLowerCase(),pw=$('li_pw').value;
  if(!validEmail(e))return note('Type a valid email address.');
  if(!pw)return note('Type your password.');
  if(!(window.crypto&&crypto.subtle))return note('This browser cannot do secure passwords here. Open the app from localhost or https.');
  var auth=null;try{auth=JSON.parse(localStorage.getItem(authKey(e))||'null')}catch(x){}
  try{
    if(!auth){
      if($('li_cw').style.display==='none'){$('li_cw').style.display='block';$('li_pw2').focus();return note('New account. Choose a password (6+ characters) and repeat it.')}
      if(pw.length<6)return note('Password must be at least 6 characters.');
      if(pw!==$('li_pw2').value)return note('The two passwords do not match.');
      var salt=hex(crypto.getRandomValues(new Uint8Array(16)));
      localStorage.setItem(authKey(e),JSON.stringify({salt:salt,hash:await hashPw(pw,salt)}))
    }else if(await hashPw(pw,auth.salt)!==auth.hash){return note('Wrong password.')}
    localStorage.setItem(SESSION,e);
    var legacy=localStorage.getItem(BASE);
    if(legacy&&!localStorage.getItem(userKey(e))&&!localStorage.getItem(BASE+'.migrated')){
      localStorage.setItem(userKey(e),legacy);localStorage.setItem(BASE+'.migrated',e);localStorage.removeItem(BASE)}
  }catch(x){return note('This browser blocks storage, so sign-in cannot work.')}
  $('li_pw').value='';$('li_pw2').value='';$('li_cw').style.display='none';note('');
  boot(e)}
function forgotPw(){
  var e=$('li_email').value.trim().toLowerCase();
  if(!validEmail(e))return note('Type your email first, then press Forgot password.');
  if(!confirm('Passwords cannot be recovered. This will ERASE all loans and reminders saved for '+e+' on this device and let you set a new password. Continue?'))return;
  try{localStorage.removeItem(authKey(e));localStorage.removeItem(userKey(e))}catch(x){}
  $('li_cw').style.display='block';note('Account reset. Choose a new password and repeat it.')}
function logout(){try{localStorage.removeItem(SESSION)}catch(e){}
  clearInterval(beepTimer);beepTimer=null;beepKey='';timers.forEach(clearInterval);timers=[];closeModal();
  S=blank();cur=null;$('app').innerHTML='';$('fab').style.display='none';document.body.className='';
  $('li_email').value='';$('li_pw').value='';$('li_cw').style.display='none';$('login').className='login on'}
function boot(email){
  KEY=userKey(email);S=load();
  if(!S.contact.email)S.contact.email=email;
  S.account=email;filter='all';upLimit=8;
  if(!S.init){var t0=dn(today());S.loans.forEach(function(L){schedule(L).forEach(function(i){if(dn(i.date)<t0)S.paid[i.id]=today()})});S.init=true}
  save();$('login').className='login';
  timers.forEach(clearInterval);timers=[];
  render();timers.push(setInterval(render,30000))}

/* ============ PWA: install + service worker ============ */
var installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e});
window.addEventListener('appinstalled',function(){installEvt=null;toast('Installed. Open it from your apps.')});
function installApp(){if(installEvt){installEvt.prompt();installEvt=null}
  else toast('Use your browser menu: Install app, or Add to Home Screen')}
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

var sess=getSession();
if(sess&&validEmail(sess))boot(sess);else $('login').className='login on';
